# reports/_brand.yml
meta:
  name: PNT Moni
  link: https://pntmoni.com

# Logo assets are not yet vendored. Re-enable once the PNGs exist
# under assets/logo/ — Quarto fails the build if a referenced file
# is missing.
# logo:
#   small: assets/logo/pntmoni-small.png
#   medium: assets/logo/pntmoni.png
#   large: assets/logo/pntmoni-large.png

color:
  palette:
    primary: "#10b981"      # L6 Active green
    secondary: "#1f2937"    # dark slate
    success: "#10b981"
    warning: "#f59e0b"
    danger: "#ef4444"
  background: "#ffffff"
  foreground: "#1f2937"
  
typography:
  fonts:
    - family: Inter
      source: google
      weight: [400, 500, 600, 700]
      style: [normal, italic]
    - family: Noto Sans JP
      source: google
      weight: [400, 500, 700]
    - family: JetBrains Mono
      source: google
      weight: [400, 500, 600]
    # Serif is used only for the report cover title (h1) in the
    # "モノクローム台帳" design — Source Serif 4 for Latin, Noto Serif JP
    # for Japanese. Without these the cover h1 silently falls back to
    # Georgia. See reports/styles/pntmoni.scss ($font-family-serif).
    - family: Source Serif 4
      source: google
      weight: [400, 600]
    - family: Noto Serif JP
      source: google
      weight: [400, 600]
  base:
    family: Inter
  headings:
    family: Inter
    weight: 600
  monospace:
    family: JetBrains Mono
