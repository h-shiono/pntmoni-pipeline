# reports/_brand.yml
meta:
  name: PNT Moni
  link: https://pntmoni.com

# Logo assets are not yet vendored. Re-enable once the PNGs exist
# under assets/logo/ — Quarto fails the build if a referenced file
# is missing.
# logo:
#   small: assets/logo/pntmoni-small.png
#   medium: assets/logo/pntmoni.png
#   large: assets/logo/pntmoni-large.png

# Palette mirrors pntmoni-docs/60-brand/tokens.json (ADR 0017).
# brand.ink is the primary editorial color; warning/danger map to the
# data-status colors (degraded/critical), success to status normal.
color:
  palette:
    primary: "#22273A"      # brand ink
    secondary: "#1F5AA6"    # brand blue
    success: "#2E8B6B"      # status normal
    warning: "#E08A1E"      # status degraded
    danger: "#C24B3A"       # status critical
  background: "#ffffff"
  foreground: "#3A4152"     # brand text.body

# Typography is owned by reports/styles/_pntmoni-tokens.scss (generated
# from tokens.json) + pntmoni.scss, which define full font stacks with
# system fallbacks (IBM Plex Sans JP / Noto Sans JP → system sans,
# IBM Plex Mono → system mono). Do NOT re-add `source: google` font declarations
# here: with `embed-resources: true` Quarto base64-embeds every declared
# family (CJK families are tens of MB per weight) into the theme CSS,
# which is then emitted three times (light + alternates) — this inflated
# the 2026-06 rapid HTML to 152 MB (~50 MB × 3 stylesheets). Readers
# without the primary fonts installed fall back to system fonts, which
# is the intended Phase 0 web-delivery behaviour. If real webfonts are
# wanted later, self-host subset woff2 next to the published report and
# reference them externally instead of embedding.
