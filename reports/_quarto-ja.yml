# reports/_quarto-ja.yml — 日本語レンダープロファイル。
#
# `quarto render <template>.qmd --profile ja --no-execute-daemon` で起動。
# 単一スイッチで全レイヤーの言語を切り替える:
#   - 本文(markdown):   ::: {.content-visible when-profile="ja"}
#   - 図表キャプション: #| fig-cap: "{{< meta caps.qc.KEY >}}"
#   - タイトル/副題:    {{< meta title_qc >}} / {{< meta subtitle_qc >}}
#   - Python 内テキスト: setup セルが QUARTO_PROFILE -> LANG -> STR[LANG]
# `--no-execute-daemon` は必須: jupyter daemon は最初の render の env を
# 固定するため、キャッシュされたカーネルが前プロファイルの
# QUARTO_PROFILE を保持してしまう(CLAS render driver に記録済みの注意点)。
# 用語は memory/report-ja-glossary.md(ユーザ確定)に従う。
lang: ja

# テンプレート別の文書タイトル(frontmatter が meta ショートコードで参照)。
title_qc: "PNT Moni 月次QCレポート"
subtitle_qc: "GEONET 観測品質 — Free Tier(無料公開版)"
title_free: "PNT Moni 月次レポート"
subtitle_free: "QZSS CLAS 性能評価 — Free Tier(無料公開版)"
title_pro: "PNT Moni 月次レポート"
subtitle_pro: "QZSS CLAS 性能評価 — Pro Tier"

