    spatial_mp_l1l2: "基準局・月間のマルチパス RMS — L1/L2 標準ペア(MP12 = L2 をパートナーとする L1 マルチパス、MP21 = L1 をパートナーとする L2 マルチパス)。"
    spatial_mp_l1l5: "基準局・月間のマルチパス RMS — L1/L5 ペア(MP15 = L5 をパートナーとする L1 マルチパス、MP51 = L1 をパートナーとする L5 マルチパス)。MP51 は MP12 より低い傾向 — 近年の L5 信号は GEONET 局でマルチパスが少ない。"
