[project]
name = "pntmoni-pipeline"
version = "0.1.0"
description = "PNT Moni — local batch pipeline for PPP-RTK evaluation and Quarto report generation"
readme = "README.md"
authors = [
    { name = "h-shiono", email = "hato.gnss@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "jupyter>=1.1.1",
    "papermill>=2.5",
    "matplotlib>=3.10.9",
    "cartopy>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pntmoni-pipeline = "pntmoni_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: marks network-dependent tests (deselect with -m 'not integration')",
]
